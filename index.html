<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>虎式 I 型 · 131</title>
<style>
  :root {
    --fg: #e8e4dc;
    --fg-dim: #9a968e;
    --line: rgba(255, 255, 255, 0.14);
    --panel: rgba(18, 19, 21, 0.72);
    --accent: #c8a05a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 18%, #2b2e33 0%, #17181b 45%, #0b0c0e 100%);
    color: var(--fg);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  /* ---------- 载入层 ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0d0e10;
    transition: opacity .7s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader h1 {
    font-size: 15px; font-weight: 400; letter-spacing: .35em;
    color: var(--fg-dim); margin: 0 0 22px; text-indent: .35em;
  }
  #bar {
    width: 220px; height: 2px; background: rgba(255,255,255,.1); overflow: hidden;
  }
  #bar > i {
    display: block; height: 100%; width: 0%; background: var(--accent);
    transition: width .25s ease;
  }
  #pct {
    margin-top: 14px; font-size: 11px; letter-spacing: .18em;
    color: #6d6a64; font-variant-numeric: tabular-nums;
  }

  /* ---------- HUD ---------- */
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  .hud * { pointer-events: auto; }

  .title { top: 0; left: 0; padding: 26px 30px; }
  .title h1 {
    margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .08em;
  }
  .title h1 span { color: var(--accent); }
  .title p {
    margin: 7px 0 0; font-size: 11.5px; letter-spacing: .16em; color: var(--fg-dim);
  }

  /* 进游戏入口 */
  .play {
    display: inline-flex; align-items: center; gap: 9px;
    margin-top: 16px; padding: 9px 17px 9px 15px;
    font-size: 12.5px; letter-spacing: .14em; color: #f0d9ab;
    border: 1px solid rgba(200,160,90,.5); border-radius: 8px;
    background: rgba(200,160,90,.1); text-decoration: none;
    transition: background .2s ease, border-color .2s ease, transform .1s ease;
  }
  .play:hover { background: rgba(200,160,90,.24); border-color: rgba(200,160,90,.85); }
  .play:active { transform: scale(.985); }
  .play i { font-style: normal; font-size: 9px; color: var(--accent); }

  .spec {
    top: 0; right: 0; padding: 28px 30px; text-align: right;
    font-size: 11px; letter-spacing: .1em; color: var(--fg-dim); line-height: 1.9;
  }
  .spec b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }

  .dock {
    left: 50%; bottom: 0; transform: translateX(-50%);
    display: flex; align-items: center; gap: 26px;
    padding: 16px 22px; margin-bottom: 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
  }
  .views { display: flex; gap: 6px; }
  .views button {
    padding: 8px 14px; font-size: 12.5px; letter-spacing: .06em;
    color: var(--fg-dim); background: transparent;
    border: 1px solid transparent; border-radius: 7px;
    cursor: pointer; transition: all .2s ease; font-family: inherit;
  }
  .views button:hover { color: var(--fg); background: rgba(255,255,255,.05); }
  .views button.on { color: #17181b; background: var(--fg); }

  .sep { width: 1px; height: 26px; background: var(--line); }

  .turret { display: flex; align-items: center; gap: 12px; }
  .turret label {
    font-size: 11px; letter-spacing: .12em; color: var(--fg-dim); white-space: nowrap;
  }
  .turret output {
    font-size: 11px; color: var(--accent); width: 42px;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 132px; height: 20px; background: transparent; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: rgba(255,255,255,.18);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5.5px;
    border-radius: 50%; background: var(--fg); border: none;
    box-shadow: 0 0 0 4px rgba(200,160,90,.18);
  }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(255,255,255,.18); }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--fg); border: none;
  }

  .hint {
    left: 0; bottom: 0; padding: 26px 30px;
    font-size: 10.5px; letter-spacing: .12em; color: #5f5c57;
  }

  #err {
    position: fixed; inset: 0; display: none; z-index: 30;
    align-items: center; justify-content: center; text-align: center;
    background: #0d0e10; font-size: 13px; line-height: 2; color: #b8b2a6;
  }

  @media (max-width: 720px) {
    .spec { display: none; }
    .hint { display: none; }
    .title { padding: 18px 20px; }
    .title h1 { font-size: 16px; }
    .dock {
      flex-direction: column; gap: 12px; padding: 12px 16px;
      margin-bottom: 14px; width: calc(100% - 28px); border-radius: 14px;
    }
    .sep { display: none; }
    input[type=range] { width: 108px; }
    .turret { gap: 8px; }
  }
</style>
</head>
<body>

<div id="loader">
  <h1>TIGER I</h1>
  <div id="bar"><i></i></div>
  <div id="pct">0%</div>
</div>

<div class="hud title">
  <h1>虎式 I 型 <span>131</span></h1>
  <p>三色迷彩 · 1943</p>
  <a class="play" href="https://gangliu8.github.io/tiger-131-game/" target="_blank" rel="noopener">
    <i>▶</i>开坦克打靶
  </a>
</div>

<div class="hud spec">
  <div>车长 <b>8.83</b> m</div>
  <div>车宽 <b>3.58</b> m</div>
  <div>车高 <b>3.14</b> m</div>
</div>

<div class="hud dock">
  <div class="views">
    <button data-view="q" class="on">前 3/4</button>
    <button data-view="side">正侧面</button>
    <button data-view="low">低角度</button>
  </div>
  <div class="sep"></div>
  <div class="turret">
    <label for="tz">炮塔</label>
    <input id="tz" type="range" min="-60" max="60" value="0" step="1">
    <output id="tzo">0°</output>
  </div>
</div>

<div class="hud hint">拖动旋转 · 滚轮缩放</div>

<div id="err"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';

const TARGET = new THREE.Vector3(0, 1.45, 0);
const VIEWS = {
  q:    new THREE.Vector3(8.6, 5.1, 10.6),
  side: new THREE.Vector3(13.8, 2.5, 0.4),
  low:  new THREE.Vector3(6.6, 1.05, 9.2)
};

/* ---------- 渲染器 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* ---------- 环境光（给 PBR 材质一个基础反射，不然侧面色死） ---------- */
function envTexture() {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.00, '#9aa9bd');
  g.addColorStop(0.42, '#6a6f78');
  g.addColorStop(0.52, '#41403c');
  g.addColorStop(1.00, '#16161a');
  x.fillStyle = g;
  x.fillRect(0, 0, 32, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromEquirectangular(envTexture());
scene.environment = envRT.texture;
scene.environmentIntensity = 1.3;
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.copy(VIEWS.q);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;   // 不许钻到地面以下
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.update();

/* ---------- 灯光 ---------- */
scene.add(new THREE.HemisphereLight(0xbcd2e8, 0x36302a, 0.55));

const key = new THREE.DirectionalLight(0xfff0d8, 3.4);
key.position.set(7, 11, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 46;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x93b4e0, 0.95);
fill.position.set(-9, 5, -7);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.15);
rim.position.set(-4, 6, -12);
scene.add(rim);

// 靠近镜头的柔光补光，避免迎光面过暗
const bounce = new THREE.DirectionalLight(0xd6dcf0, 0.85);
bounce.position.set(-8, 4.2, 9.5);
scene.add(bounce);

/* ---------- 地面 ---------- */
function groundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(256, 256, 10, 256, 256, 256);
  g.addColorStop(0.00, '#4a4d53');
  g.addColorStop(0.45, '#2a2d33');
  g.addColorStop(1.00, '#111214');
  x.fillStyle = g;
  x.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(24, 72),
  new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 0.94, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- 载入模型 ---------- */
let pivot = null;
const loader = new GLTFLoader();
const barEl = document.querySelector('#bar > i');
const pctEl = document.getElementById('pct');

loader.load(
  './tiger.glb',
  (gltf) => {
    const model = gltf.scene;
    model.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.receiveShadow = true;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        m.roughness = Math.min(1, m.roughness ?? 0.8);
        m.envMapIntensity = 0.5;
      });
    });
    // Blender 里车头朝 +Y，转成 glTF 后朝 -Z；转回来让车头对着默认机位
    model.rotation.y = Math.PI;
    scene.add(model);

    pivot = model.getObjectByName('Turret_Pivot');
    if (!pivot) console.warn('未找到 Turret_Pivot 节点');

    finishLoading();
  },
  (e) => {
    if (!e.total) return;
    const p = Math.min(99, Math.round((e.loaded / e.total) * 100));
    barEl.style.width = p + '%';
    pctEl.textContent = p + '%';
  },
  (e) => {
    console.error(e);
    document.getElementById('err').style.display = 'flex';
    document.getElementById('err').innerHTML =
      '模型加载失败<br><span style="font-size:11px;color:#7a766e">' +
      '请用本地服务器打开（双击 本地预览.bat），或确认 tiger.glb 与网页在同一目录</span>';
  }
);

function finishLoading() {
  barEl.style.width = '100%';
  pctEl.textContent = '100%';
  setTimeout(() => document.getElementById('loader').classList.add('hide'), 320);
}

/* ---------- 炮塔 ---------- */
const tz = document.getElementById('tz');
const tzo = document.getElementById('tzo');
tz.addEventListener('input', () => {
  const deg = Number(tz.value);
  tzo.textContent = deg + '°';
  if (pivot) pivot.rotation.y = THREE.MathUtils.degToRad(deg);
});

/* ---------- 视角切换 ---------- */
const btns = [...document.querySelectorAll('.views button')];
let tween = null;

function goTo(name) {
  btns.forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  const to = VIEWS[name].clone();
  tween = {
    from: camera.position.clone(),
    to,
    t: 0,
    dur: 780,
    start: performance.now()
  };
  controls.autoRotate = false;
}

btns.forEach((b) => b.addEventListener('click', () => goTo(b.dataset.view)));

/* ---------- 主循环 ---------- */
function animate(now) {
  requestAnimationFrame(animate);

  if (tween) {
    const k = Math.min(1, (now - tween.start) / tween.dur);
    const e = 1 - Math.pow(1 - k, 3);           // ease-out cubic
    camera.position.lerpVectors(tween.from, tween.to, e);
    if (k >= 1) tween = null;
  }

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ---------- 自适应 ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 调试用
window.__dbg = () => {
  const bb = (o) => {
    const b = new THREE.Box3().setFromObject(o);
    return {
      name: o.name || o.type,
      min: b.min.toArray().map((v) => +v.toFixed(2)),
      max: b.max.toArray().map((v) => +v.toFixed(2))
    };
  };
  return {
    cam: camera.position.toArray().map((v) => +v.toFixed(2)),
    dist: +camera.position.distanceTo(controls.target).toFixed(2),
    fov: camera.fov,
    aspect: +camera.aspect.toFixed(3),
    children: scene.children.map(bb)
  };
};
</script>
</body>
</html>
